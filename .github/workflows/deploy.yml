name: Deploy to Firebase Hosting and Functions

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "src/**"
      - "scripts/**"
      - "firebase.json"
      - ".firebaserc"
      - "functions/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: firebase-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Lấy đủ lịch sử: bước chọn target bên dưới so sánh với commit TRƯỚC khi
      # push, mà commit đó có thể nằm ngoài một bản clone nông. Đẩy nhiều commit
      # một lượt từng làm workflow chết ngay ở bước đó với "fatal: bad object".
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Firebase deploy targets
        id: targets
        shell: bash
        run: |
          before="${{ github.event.before }}"

          # Không tin tưởng mù quáng vào commit "before": nó rỗng/toàn số 0 khi
          # nhánh vừa được tạo, và có thể không tồn tại sau khi lịch sử bị viết
          # lại. Khi không xác định được phạm vi thay đổi thì deploy CẢ HAI
          # target — chậm hơn một chút nhưng luôn đúng, thay vì hỏng cả lần chạy.
          if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]] \
             && git cat-file -e "$before^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$before" "${{ github.sha }}")"
          else
            echo "Không xác định được commit gốc ($before) — deploy cả hosting lẫn functions cho an toàn."
            changed="functions/"
          fi

          targets="hosting"

          if grep -Eq '^(functions/|firebase\.json$|\.firebaserc$|\.github/workflows/deploy\.yml$)' <<< "$changed"; then
            targets="hosting,functions"
          fi

          {
            echo "targets=$targets"

            if [[ "$targets" == *functions* ]]; then
              echo "functions=true"
            else
              echo "functions=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Copy index.html to public and functions
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp index.html functions/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        if: steps.targets.outputs.functions == 'true'
        working-directory: functions
        env:
          npm_config_registry: https://registry.npmjs.org
        run: |
          npm install --package-lock=false --ignore-scripts --no-audit --no-fund
          test -f node_modules/firebase-functions/package.json
          test -f node_modules/firebase-admin/package.json

      - name: Write service account key to file
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-key.json

      - name: Deploy to Firebase
        run: firebase deploy --only "${{ steps.targets.outputs.targets }}" --project congtachoinongdan
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json

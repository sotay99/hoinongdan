name: Deploy to Firebase Hosting and Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy index.html to public and functions
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp index.html functions/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        run: cd functions && npm install

      - name: Write service account key to file
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-key.json

      - name: Deploy to Firebase (Hosting + Functions)
        run: firebase deploy --only hosting,functions --project congtachoinongdan
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json
